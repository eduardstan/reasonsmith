[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonsmith"
version = "0.1.0"
description = "Audit-grade evidence records and reason-deletion certificates for symbolic decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ionel Eduard Stan" }]
dependencies = [
    # nesyarena supplies the ground-program IR, bounded proof enumeration, the exact WMC oracle and
    # the adapter protocol. It is not on PyPI, so it is pinned here to an immutable commit of the
    # public repository: `pip install -e .` therefore resolves it identically for a stranger and for
    # CI, and the certificate numbers stay reconstructible. Bump the SHA deliberately, never to a
    # branch name.
    "nesyarena @ git+https://github.com/eduardstan/nesyarena@fdf0d5eb54c7af181e15b94d3b68d5d6bb7712ec",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasonsmith = ["table7.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
