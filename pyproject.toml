[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonsmith"
version = "0.9.1"
description = "evidence records and reason-deletion certificates for decision systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ionel Eduard Stan" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # nesyarena supplies the ground-program IR, bounded proof enumeration, the exact WMC oracle and
    # the adapter protocol. Pinned exactly to 0.1.0 so `pip install -e .` resolves identically for
    # a stranger and for CI, and the certificate numbers stay reconstructible.
    "nesyarena==0.1.0",
    # Pinned for the same reason as nesyarena: rtamt robustness scores land in every temporal
    # result's `evaluation_scores`, so a floating version would move published numbers. 0.3.5
    # also hard-pins antlr4-python3-runtime==4.7, whose `from typing.io import TextIO` needs the
    # shim at the top of engines/observed.py on Python 3.13+.
    "rtamt==0.3.5",
    # Z3 SMT solver for the proved engine (formal logic verification). Pinned exactly for the same
    # reason as the two above: the solver picks which counterexample to return, and that value is
    # printed verbatim in the evidence summary and the HTML report, so an unpinned solver moves
    # reported output between installs.
    "z3-solver==5.0.0.0",
]

[project.optional-dependencies]
# The finite-trace decision procedure `validate-pack --analyse` puts temporal duties to
# (`src/reasonsmith/ltlf.py`). The backend uses the BLACK solver invoked as a subprocess
# behind a strict boundary. The user installs BLACK via their OS package manager or from
# https://www.black-sat.org.
ltlf = []
# Model-facing autoformalisation proposer. Providers (including Ollama and the Claude Code CLI)
# are installed separately; this extra intentionally has no Python dependency.
proposer = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
]

[project.scripts]
reasonsmith = "reasonsmith.cli:main"

[project.urls]
Homepage = "https://reasonsmith.dev"
Documentation = "https://reasonsmith.dev"
Repository = "https://github.com/eduardstan/reasonsmith"
Issues = "https://github.com/eduardstan/reasonsmith/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `examples/sample_decisions.jsonl` is here for the same reason as the packs: a documented command
# names it, so it has to be in the wheel. The example systems beside it are `.py` modules and are
# packaged as modules. `tests/test_packaged_examples.py` fails if either stops shipping.
reasonsmith = ["table7.toml", "packs/*.toml", "examples/*.jsonl", "challenges/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# The example systems under `reasonsmith.examples` are executed as subprocesses by
# `tests/test_docs_three_systems.py` and `tests/test_docs_language_model.py`, which hold their
# stdout byte-for-byte — a stricter check than a line count, and one the coverage process cannot
# see. They ship in the wheel so the documented commands run, not because the library imports
# them, so leaving them in would measure the demonstration and report it as library coverage.
omit = ["*/reasonsmith/examples/*"]

[tool.coverage.report]
# Load-bearing, not cosmetic. `--cov-fail-under=N` is decided by
# `coverage.results.should_fail_under`, which compares `round(total, precision)` against N, and
# pytest-cov defaults `precision` to 0. At 0 a real 92.79% rounded to 93 and the then-93 floor did
# not fail — while pytest-cov's own end-of-run summary compares the unrounded total and prints
# "FAIL Required test coverage of 93% not reached", so the log said FAIL and the job exited 0.
# Two digits makes the comparison the one the printed figure states, which is also what makes a
# fractional floor mean anything: `.github/workflows/ci.yml` carries 92.5 and the decision behind
# it. Set here rather than as a flag so both workflows inherit it, along with a local run.
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
