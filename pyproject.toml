[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonsmith"
version = "0.1.0"
description = "Audit-grade evidence records and reason-deletion certificates for symbolic decisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ionel Eduard Stan" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # nesyarena supplies the ground-program IR, bounded proof enumeration, the exact WMC oracle and
    # the adapter protocol. It is not on PyPI, so it is pinned here to an immutable commit of the
    # public repository: `pip install -e .` therefore resolves it identically for a stranger and for
    # CI, and the certificate numbers stay reconstructible. Bump the SHA deliberately, never to a
    # branch name.
    "nesyarena @ git+https://github.com/eduardstan/nesyarena@57720fa212834689692e171882272140f1d1fed7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/eduardstan/reasonsmith"
Repository = "https://github.com/eduardstan/reasonsmith"
Issues = "https://github.com/eduardstan/reasonsmith/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reasonsmith = ["table7.toml", "packs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
