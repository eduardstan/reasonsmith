requirement = "eu_ai_act_art13_transparency"
rationale = "These cases exercise each independently required evidence field in the hand-authored property. The near-miss uses a blank value, which is not a recorded value even when the field key exists."

[[case]]
id = "complete-record"
kind = "satisfied"
expected = "satisfied"
description = "Every required record is supplied: model and data version ids, extraction timestamp, dataset snapshot hash, fidelity coverage metrics, explanation scope, linkage from decision to artifact."
[case.signals]
model_and_data_version_ids = "recorded model and data version ids"
extraction_timestamp = "recorded extraction timestamp"
dataset_snapshot_hash = "recorded dataset snapshot hash"
fidelity_coverage_metrics = "recorded fidelity coverage metrics"
explanation_scope = "recorded explanation scope"
linkage_from_decision_to_artifact = "recorded linkage from decision to artifact"

