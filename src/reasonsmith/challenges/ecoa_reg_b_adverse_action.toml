requirement = "ecoa_reg_b_adverse_action"
rationale = "These cases exercise each independently required evidence field in the hand-authored property. The near-miss uses a blank value, which is not a recorded value even when the field key exists."

[[case]]
id = "complete-record"
kind = "satisfied"
expected = "satisfied"
description = "Every required record is supplied: stored reasons per decision, model version, score factors, audit ids, retention for regulatory lookback."
[case.signals]
stored_reasons_per_decision = "recorded stored reasons per decision"
model_version = "recorded model version"
score_factors = "recorded score factors"
audit_ids = "recorded audit ids"
retention_for_regulatory_lookback = "recorded retention for regulatory lookback"

