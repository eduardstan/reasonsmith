####################################################################################################
# Table 7 regulation pack for reasonsmith v0.2.
#
# This pack re-expresses Table 7 of "Symbols and Neurons: A Review of Symbolic XAI in Deep Learning"
# (Stan, Sciavicco & Napoletano, JAIR 2026, p. 36:22) as formal requirements with signal dependencies.
#
# This file is derived, `../table7.toml` is the authority. The derivation is mechanical and is
# checked by `tests/test_v02_core.py::test_pack_matches_table7_transcription`, which asserts, per
# row and by `id`:
#
#   * `verbatim_text` equals the row's Requirement column, character for character;
#   * `source_document` and `article_clause` are both substrings of the row's Legal source column,
#     which is split across the two fields only so that code can address the document separately;
#   * `requires` is exactly the row's `evidence_field` keys, in the printed order.
#
# So the signal names are the paper's own evidence-field keys, not a house vocabulary. Renaming one
# here would break that test rather than silently detach the pack from the print.
#
# `stakeholder` and `spec` are the only interpretive fields: the paper's table has no such columns.
# They are editorial, they are not quoted, and no check derives a verdict from their wording.
####################################################################################################

[pack]
id = "table7"
title = "Table 7: Symbolic XAI Regulatory & Governance Duties"
description = "Checklist tying symbolic artifacts to legal/assurance duties and required minimal evidence."

[source]
table = "Table 7"
caption = "Checklist that ties symbolic artifacts to legal/assurance duties and the associated logging."
paper = "Symbols and Neurons: A Review of Symbolic XAI in Deep Learning"
authors = "Stan, Sciavicco & Napoletano"
venue = "Journal of Artificial Intelligence Research, Vol. 86, Article 36"
publication_date = "July 2026"
page = "36:22"
section = "5.3 Alignment with Regulatory and Governance Requirements"

[[requirement]]
id = "eu_ai_act_art13_transparency"
source_document = "EU AI Act"
article_clause = "Art. 13"
verbatim_text = "Transparency and information to deployers"
stakeholder = "deployer"
formalism = "record"
spec = """\
present(model_and_data_version_ids) and \
present(extraction_timestamp) and \
present(dataset_snapshot_hash) and \
present(fidelity_coverage_metrics) and \
present(explanation_scope) and \
present(linkage_from_decision_to_artifact)"""
rationale = "Technical documentation and minimal evidence retainment for transparency duties."
requires = [
    "model_and_data_version_ids",
    "extraction_timestamp",
    "dataset_snapshot_hash",
    "fidelity_coverage_metrics",
    "explanation_scope",
    "linkage_from_decision_to_artifact",
]
binding = true
scope = "high-risk"

[[requirement]]
id = "eu_ai_act_art12_record_keeping"
source_document = "EU AI Act"
article_clause = "Art. 12"
verbatim_text = "Record–keeping (event logging)"
stakeholder = "regulator"
formalism = "record"
spec = "present(automatic_event_logs) and present(retention_schedule) and present(signer)"
rationale = "Automatic event logs and retention schedules for high-risk AI system record-keeping."
requires = [
    "automatic_event_logs",
    "retention_schedule",
    "signer",
]
binding = true
scope = "high-risk"

[[requirement]]
id = "gdpr_art22_meaningful_information"
source_document = "GDPR"
article_clause = "Art. 22 (and Rec. 71)"
verbatim_text = "Automated decisions: “meaningful information about the logic involved”"
stakeholder = "affected individual"
formalism = "record"
spec = """\
present(per_decision_reason_string) and \
present(feature_to_named_concept_mapping) and \
present(dpia_cross_reference)"""
rationale = "Per-decision reason strings and concept mappings for automated decision explanations."
requires = [
    "per_decision_reason_string",
    "feature_to_named_concept_mapping",
    "dpia_cross_reference",
]
# The row's printed legal source cites Art. 22 and Rec. 71 together. Art. 22 is directly
# applicable, so the row is binding; the Article/Recital split is drawn clause by clause in
# packs/gdpr.toml.
binding = true
scope = ""

[[requirement]]
id = "ecoa_reg_b_adverse_action"
source_document = "ECOA / Reg B"
article_clause = "12 CFR 1002.9"
verbatim_text = "Adverse action reasons in credit decisions"
stakeholder = "affected individual"
formalism = "record"
spec = """\
present(stored_reasons_per_decision) and \
present(model_version) and \
present(score_factors) and \
present(audit_ids) and \
present(retention_for_regulatory_lookback)"""
rationale = "Stored reason codes and score factors for credit adverse action notices."
requires = [
    "stored_reasons_per_decision",
    "model_version",
    "score_factors",
    "audit_ids",
    "retention_for_regulatory_lookback",
]
binding = true
scope = ""

[[requirement]]
id = "fda_gmlp_samd"
source_document = "FDA GMLP"
article_clause = "agency transparency guidance"
verbatim_text = "Good ML Practice/transparency for SaMD"
stakeholder = "regulator"
formalism = "record"
spec = "present(design_history_links) and present(verification_logs) and present(change_control)"
rationale = "Design history links and verification logs for Software as a Medical Device."
requires = [
    "design_history_links",
    "verification_logs",
    "change_control",
]
binding = false
scope = ""

[[requirement]]
id = "nist_ai_rmf_risk_evidence"
source_document = "NIST AI RMF"
article_clause = "1.0"
verbatim_text = "Risk evidence and continuous monitoring"
stakeholder = "deployer"
formalism = "record"
spec = """\
present(continuous_monitoring_logs) and \
present(metric_thresholds_and_alerts) and \
present(reviews_and_sign_offs) and \
present(incident_tickets)"""
rationale = "Continuous monitoring logs and metric thresholds for risk governance."
requires = [
    "continuous_monitoring_logs",
    "metric_thresholds_and_alerts",
    "reviews_and_sign_offs",
    "incident_tickets",
]
binding = false
scope = ""
