[pack]
id = "ecoa"
title = "ECOA / Regulation B (12 CFR 1002.9): Adverse Action Notices"
description = "Requirements for adverse credit decision notifications, specific principal reasons, and record retention. The timing requirement needs artifact_logs_counteroffer_not_accepted to tell the 30-day deadline of 1002.9(a)(1)(i)-(iii) from the 90-day deadline of (iv); a log that never carries that field is reported unattainable on it rather than judged against a deadline the clause may not set. The content requirement of 1002.9(a)(2) is an either/or, and neither branch signal gates it: requiring artifact_logs_reason_explanation would report a creditor lawfully disclosing the right to request reasons unattainable, and requiring artifact_logs_right_to_reasons_disclosure would do the same to a creditor that simply gave the reasons. Only artifact_logs_decision_record and provenance_model_version gate it, because the clause demands them of every branch. The price is stated rather than hidden: a system that declares neither branch signal is judged on its trace and reported violated, not reported unattainable, so a creditor that complies in the world but exposes nothing about the contents of its notifications is reported violated on this duty. A second price is the trace the duty needs: an either/or is not a conjunction of present() atoms, so the property is quantified over the trace, and the observed engine needs at least two decisions to establish the sampling period it reasons over. A log holding exactly one decision is reported not evaluated on this duty rather than satisfied or violated, and it leaves the binding headline counts. This duty was a record duty before the either/or was formalised, and a one-record log was enough for it then. The specific-reasons requirement of 1002.9(b)(2) pays the same short-trace price for the same kind of reason: it is guarded by the trigger the clause states in its own first words — it governs the statement of reasons *required by paragraph (a)(2)(i)* — so a creditor that lawfully took the disclosure branch is no longer reported violated on it, and an implication is not a conjunction of present() atoms either. What that guard costs is stated too: where nothing an engine looked at carries a statement of reasons the trigger fired nowhere, and the duty is reported not evaluated rather than satisfied — so a creditor lawfully on the disclosure branch is neither accused nor cleared on this duty, and gets no line in the satisfied column for a clause that never bit (docs/semantics.md §4). That duty is also the first here whose verdict turns on what a statement says rather than on whether a field is blank: it checks that the statement is not one of the two the clause itself calls insufficient. It does not decide whether any other statement is specific, and no wording in it is this pack's invention. 12 CFR 1002.9(b)(2) carries a second duty here, on the other half of its first sentence: the notice must indicate the principal reason(s), plural, and ecoa_reg_b_1002_9_b_2_principal_reasons_complete asks whether the reasons a decision states are all the reasons its own inference had. It is the one duty in any shipped pack that no log can settle. Its gate, artifact_logs_deleted_reason_count, is measured rather than read: reasonsmith enumerates the decision's reasons exactly from an inference artefact the system exposes and switches each one off in turn, and a system that exposes no such artefact is reported unattainable on it rather than judged by whether its reason field is non-blank. That substitution is what the duty exists to refuse, and it is the difference between a notice that names a reason and a notice that names the reasons. 12 CFR 1002.9(c)(2) carries the one duty here whose obligation has an end as well as a beginning: a notice of incompleteness stands until the applicant supplies the information and the creditor acts under paragraph (a), or the designated time period lapses without a response, after which the clause says the creditor has no further obligation. It is the first shipped duty written with `until`, and its second branch is the clause's own defeater carried in the property rather than left to a reader. The designated period is a reasonable one the creditor designates, so no length is fixed here: the property reads whether the log says the period lapsed, never how long it was. All six duties are limited to the consumer-credit decision domain. That classification is this pack author's reading of 12 CFR 1002.9, written in a vocabulary this repository defines (reasonsmith.spec.DECISION_DOMAINS) — the regulation names no such list, and no statute defines one. It buys one guarantee and no more: a system that has not declared what kind of decision it makes is reported not applicable on these duties rather than satisfied, so an adverse-action notice duty no longer clears a system that issues no credit and notifies nobody. It does not decide whether any particular creditor is within Regulation B's reach."

[source]
document = "CFPB Regulation B / Equal Credit Opportunity Act (12 CFR § 1002.9)"
publication = "Code of Federal Regulations, Title 12, Chapter X, Part 1002"
url = "https://www.consumerfinance.gov/rules-policy/regulations/b/9/"

[[requirement]]
id = "ecoa_reg_b_1002_9_a_1_timing_of_notice"
source_document = "ECOA / Regulation B (12 CFR 1002.9)"
article_clause = "12 CFR 1002.9(a)(1)"
verbatim_text = """A creditor shall notify an applicant of action taken within:
(i) 30 days after receiving a completed application concerning the creditor's approval of, counteroffer to, or adverse action on the application;
(ii) 30 days after taking adverse action on an incomplete application, unless notice is provided in accordance with paragraph (c) of this section;
(iii) 30 days after taking adverse action on an existing account; or
(iv) 90 days after notifying the applicant of a counteroffer if the applicant does not expressly accept or use the credit offered."""
stakeholder = "affected individual"
formalism = "temporal"
spec = "always(present(artifact_logs_decision_record) -> ((artifact_logs_notification_latency_days <= 30) or ((artifact_logs_counteroffer_not_accepted >= 0.5) and (artifact_logs_notification_latency_days <= 90))))"
rationale = """Every decision the log records was notified within the deadline its own paragraph sets: 30 days \
under (i)-(iii), or 90 days where the record says the applicant did not accept a counteroffer, which is the \
only case (iv) reaches. Both numbers are the clause's own; neither is this pack's."""
requires = [
    "artifact_logs_decision_record",
    "artifact_logs_notification_latency_days",
    "artifact_logs_counteroffer_not_accepted",
]
binding = true
scope = ""
domains = ["consumer-credit"]
deontic_type = "obligation"
defeasibility = "defeasible-unmodelled"

[[requirement]]
id = "ecoa_reg_b_1002_9_a_2_written_statement"
source_document = "ECOA / Regulation B (12 CFR 1002.9)"
article_clause = "12 CFR 1002.9(a)(2)"
verbatim_text = """A notification given to an applicant when adverse action is taken shall be in writing and shall contain a statement of the action taken; the name and address of the creditor; a statement of the provisions of section 701(a) of the Act; the name and address of the Federal agency that administers compliance with respect to the creditor; and either:
(i) A statement of specific reasons for the action taken; or
(ii) A disclosure of the applicant's right to a statement of specific reasons within 30 days, if the statement is requested within 60 days of the creditor's notification. The disclosure shall include the name, address, and telephone number of the person or office from which the statement of reasons can be obtained. If the creditor chooses to provide the reasons orally, the creditor shall also disclose the applicant's right to have them confirmed in writing within 30 days of receiving the applicant's written request for confirmation."""
stakeholder = "affected individual"
formalism = "temporal"
spec = """\
always(present(artifact_logs_decision_record) and \
present(provenance_model_version) and \
(present(artifact_logs_reason_explanation) or \
present(artifact_logs_right_to_reasons_disclosure)))"""
rationale = """Every decision the log records carries the decision record and the model version that \
produced it, together with one of the two contents the clause accepts: a statement of specific \
reasons under point (i), or a disclosure of the applicant's right to request one under point (ii). \
The disjunction is the clause's own `either`, so a creditor that lawfully took one branch is not \
held to the other."""
requires = [
    "artifact_logs_decision_record",
    "provenance_model_version",
]
binding = true
scope = ""
domains = ["consumer-credit"]
deontic_type = "obligation"
defeasibility = "trigger-unmodelled"

[[requirement]]
id = "ecoa_reg_b_1002_9_b_2_specific_reasons"
source_document = "ECOA / Regulation B (12 CFR 1002.9)"
article_clause = "12 CFR 1002.9(b)(2)"
verbatim_text = "The statement of reasons for adverse action required by paragraph (a)(2)(i) of this section must be specific and indicate the principal reason(s) for the adverse action. Statements that the adverse action was based on the creditor's internal standards or policies or that the applicant, joint applicant, or similar party failed to achieve a qualifying score on the creditor's credit scoring system are insufficient."
stakeholder = "affected individual"
formalism = "logical"
spec = """\
present(artifact_logs_reason_explanation) -> ( \
present(provenance_model_version) and \
present(scope_statements_local_vs_global) and \
not contains(artifact_logs_reason_explanation, "internal standards") and \
not contains(artifact_logs_reason_explanation, "internal policies") and \
not contains(artifact_logs_reason_explanation, "failed to achieve a qualifying score"))"""
rationale = """Where a decision carries a statement of reasons — which is when this clause bites, \
because by its own words it governs the statement paragraph (a)(2)(i) requires, and a creditor \
that lawfully took the (a)(2)(ii) disclosure branch has none yet — that statement names the model \
version and the scope it speaks for, and is not one of the two the clause itself calls \
insufficient: that the action rested on the creditor's internal standards or policies, or that the \
applicant failed to achieve a qualifying score. The forbidden wordings are the clause's own; none \
is this pack's, and nothing here decides whether any other statement is specific. One of the three \
is a reading rather than a quotation: the clause writes `internal standards or policies`, one \
adjective over two coordinated nouns, so the property looks for `internal standards` and \
`internal policies` separately."""
requires = [
    "artifact_logs_reason_explanation",
    "provenance_model_version",
    "scope_statements_local_vs_global",
]
binding = true
scope = ""
domains = ["consumer-credit"]
deontic_type = "prohibition"
defeasibility = "trigger-unmodelled"

[[requirement]]
id = "ecoa_reg_b_1002_9_b_2_principal_reasons_complete"
source_document = "ECOA / Regulation B (12 CFR 1002.9)"
article_clause = "12 CFR 1002.9(b)(2)"
verbatim_text = "The statement of reasons for adverse action required by paragraph (a)(2)(i) of this section must be specific and indicate the principal reason(s) for the adverse action."
stakeholder = "affected individual"
formalism = "logical"
spec = """\
present(artifact_logs_reason_explanation) -> \
(artifact_logs_deleted_reason_count <= 0)"""
rationale = """Where a decision carries a statement of reasons — the same trigger the sibling \
duty carries, and for the same reason, because this clause governs the statement paragraph \
(a)(2)(i) requires — no reason the decision's own inference had is missing from it. The count is \
measured, never read from the log: reasonsmith enumerates the decision's reasons exactly from the \
inference artefact the system exposes and switches each one off in turn, and counts the reasons \
the system's own answer turns out not to depend on. The threshold is zero and is not this pack's \
invention: the clause requires the principal reason(s), plural, for the action taken, so a reason \
that moved exact inference and not the system is a principal reason the notice does not state. \
Nothing here decides whether the reasons that *are* stated are specific — that is the sibling \
duty — and nothing here says the enumerated reasons are the right ones, only that the system used \
all of the ones its own inference found."""
requires = [
    "artifact_logs_reason_explanation",
    "artifact_logs_deleted_reason_count",
]
binding = true
scope = ""
domains = ["consumer-credit"]
deontic_type = "obligation"
defeasibility = "trigger-unmodelled"

[[requirement]]
id = "ecoa_reg_b_1002_9_c_2_incompleteness_notice_runs_out"
source_document = "ECOA / Regulation B (12 CFR 1002.9)"
article_clause = "12 CFR 1002.9(c)(2)"
verbatim_text = "The creditor shall have no further obligation under this section if the applicant fails to respond within the designated time period. If the applicant supplies the requested information within the designated time period, the creditor shall take action on the application and notify the applicant in accordance with paragraph (a) of this section."
stakeholder = "affected individual"
formalism = "temporal"
spec = """\
always(present(artifact_logs_incompleteness_notice_sent) -> \
until(present(artifact_logs_incompleteness_notice_sent), \
present(artifact_logs_action_taken_notification) or \
present(artifact_logs_response_period_lapsed)))"""
rationale = """Where the log records that a notice of incompleteness was sent, that notice stands \
as the creditor's position until one of the two endings the clause itself names arrives: the \
applicant supplied the requested information and the creditor took action and notified under \
paragraph (a), or the designated time period lapsed without a response, after which the clause \
says the creditor has no further obligation. The obligation therefore has a beginning and an end \
in the trace, which is what `until` states and what no state property of one decision record can. \
Both endings are the clause's own, and neither is this pack's invention; the second is the \
clause's own defeater, carried in the property as the second branch rather than left to a reader. \
The designated period is `a reasonable period of time` the creditor designates, so it is a length \
the regulation does not fix and this pack does not invent one: the property reads whether the log \
says the period lapsed, never how long it was."""
requires = [
    "artifact_logs_incompleteness_notice_sent",
]
binding = true
scope = ""
domains = ["consumer-credit"]
deontic_type = "obligation"
defeasibility = "defeasible-modelled"

[[requirement]]
id = "ecoa_reg_b_1002_4_a_no_disparate_treatment"
source_document = "ECOA / Regulation B (12 CFR 1002.4)"
article_clause = "12 CFR 1002.4(a)"
verbatim_text = "A creditor shall not discriminate against an applicant on a prohibited basis regarding any aspect of a credit transaction."
stakeholder = "applicant"
formalism = "counterfactual"
spec = "counterfactually_invariant(artifact_logs_decision_record, applicant_prohibited_basis)"
rationale = """No applicant's decision would have been different had the prohibited basis alone \
been different. The clause forbids discriminating *against an applicant* on a prohibited basis, \
which is disparate treatment, and this is the narrowest formal reading of that limb: hold every \
other input of the decision fixed, move the one variable the system accepts as the prohibited \
basis, and the decision must not move. What it cannot see is the rest of the clause's reach, and \
the omission is deliberate rather than hidden: a proxy is invisible to it — a rule set that never \
reads the prohibited basis and decides by postcode satisfies this duty — and disparate impact, \
which is a fact about effects across a population, is not a property of any pair of decisions and \
remains unformalised here (docs/refinement.md). It reaches exactly one variable, so a creditor \
answerable on several prohibited bases is answered here about the one this duty names. \
`applicant_prohibited_basis` is an input the decision procedure accepts and not a field a \
decision record must carry: the question is whether the procedure uses it, and a system answers \
it from its declared logic while its audit log holds a prohibited basis for nobody. A system \
whose declared logic has no notion of the variable is reported unattainable and never satisfied, \
because not knowing a prohibited basis is not evidence of not using one."""
requires = [
    "artifact_logs_decision_record",
    "applicant_prohibited_basis",
]
binding = true
scope = ""
domains = ["consumer-credit"]
deontic_type = "prohibition"
defeasibility = "strict"
