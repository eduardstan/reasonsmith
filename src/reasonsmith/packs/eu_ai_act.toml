[pack]
id = "eu_ai_act"
title = "EU AI Act (Regulation (EU) 2024/1689): Articles 12 & 13"
description = "Requirements for high-risk AI system record-keeping (Art. 12) and transparency to deployers (Art. 13). Article 12(1) and Article 12(2) carry the same property, so no system can satisfy one and violate the other, and a reader must not take two agreeing verdicts here for two independent checks. They are not differentiated because nothing in the Section 6.3 signal vocabulary stands for the relevance of a logged event to identifying a risk situation or a substantial modification, to post-market monitoring, or to Article 26(5) operation monitoring; a signal invented for it would be this pack's own reading of the Article presented as the Article's. The overlap is recorded in docs/refinement.md instead."

[source]
document = "Regulation (EU) 2024/1689 of the European Parliament and of the Council"
publication = "Official Journal of the European Union, OJ L, 2024/1689, 12.7.2024"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689"

[[requirement]]
id = "eu_ai_act_art12_1_automatic_logging"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 12(1)"
verbatim_text = "High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system."
stakeholder = "regulator"
formalism = "record"
spec = "present(artifact_logs_event_log) and present(provenance_model_version)"
rationale = "Automatic lifetime event logs retaining decision events."
requires = [
    "artifact_logs_event_log",
    "provenance_model_version",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art12_2_traceability_monitoring"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 12(2)"
verbatim_text = """In order to ensure a level of traceability of the functioning of a high-risk AI system that is appropriate to the intended purpose of the system, logging capabilities shall enable the recording of events relevant for:
   (a) identifying situations that may result in the high-risk AI system presenting a risk within the meaning of Article 79(1) or in a substantial modification;
   (b) facilitating the post-market monitoring referred to in Article 72; and
   (c) monitoring the operation of high-risk AI systems referred to in Article 26(5)."""
stakeholder = "regulator"
formalism = "record"
spec = "present(artifact_logs_event_log) and present(provenance_model_version)"
rationale = "Every decision carries an event log entry identifying the model version that produced it."
requires = [
    "artifact_logs_event_log",
    "provenance_model_version",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art13_1_transparency_deployers"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 13(1)"
verbatim_text = "High-risk AI systems shall be designed and developed in such a way as to ensure that their operation is sufficiently transparent to enable deployers to interpret a system’s output and use it appropriately. An appropriate type and degree of transparency shall be ensured with a view to achieving compliance with the relevant obligations of the provider and deployer set out in Section 3."
stakeholder = "deployer"
formalism = "record"
spec = """\
present(scope_statements_explanation_scope) and \
present(artifact_logs_reason_explanation) and \
present(provenance_model_version)"""
rationale = "Decision output accompanied by explanation scope and model provenance for deployers."
requires = [
    "scope_statements_explanation_scope",
    "artifact_logs_reason_explanation",
    "provenance_model_version",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art13_2_instructions_for_use"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 13(2)"
verbatim_text = "High-risk AI systems shall be accompanied by instructions for use in an appropriate digital format or otherwise that include concise, complete, correct and clear information that is relevant, accessible and comprehensible to deployers."
stakeholder = "deployer"
formalism = "record"
spec = "present(scope_statements_approximation_vs_guarantee) and present(provenance_constraint_set)"
rationale = "Instructions for use and performance bounds accessible to deployers."
requires = [
    "scope_statements_approximation_vs_guarantee",
    "provenance_constraint_set",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"
