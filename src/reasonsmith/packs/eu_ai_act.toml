[pack]
id = "eu_ai_act"
title = "EU AI Act (Regulation (EU) 2024/1689): Articles 12, 13, 50 & 86"
description = "Requirements for high-risk AI system record-keeping (Art. 12), transparency to deployers (Art. 13), limited-risk Article 50 transparency for natural-person interaction and synthetic-content marking, and the affected person's right to an explanation of an individual decision (Art. 86). Articles 12 and 13 bind the provider, whereas Article 86(1) binds the deployer — and the evidence the property needs comes from the provider's system, not from the deployer, so a run against a system establishes nothing about which party deployed it. Article 12(1) and Article 12(2) carry the same property, so no system can satisfy one and violate the other, and a reader must not take two agreeing verdicts here for two independent checks. They are not differentiated because nothing in the Section 6.3 signal vocabulary stands for the relevance of a logged event to identifying a risk situation or a substantial modification, to post-market monitoring, or to Article 26(5) operation monitoring; a signal invented for it would be this pack's own reading of the Article presented as the Article's. The overlap is recorded in docs/refinement.md instead. Article 50(5) checks only the ordering signal at recorded interaction boundaries and does not model clarity, distinguishability, accessibility, understanding, or Article 50(1) and 50(2) exceptions; Article 50(2) is a presence check for a marking and does not establish machine-readability or detectability. Both Article 50 duties carry the limited-risk scope, so an undeclared class is reported not applicable rather than satisfied. Article 86(1) is the one duty here that no log can settle, and the only one that reaches above the record fragment: it refines the clause's main elements of the decision taken against the decision's own inference, so its gate artifact_logs_deleted_reason_count is measured rather than read — reasonsmith enumerates the decision's reasons from an inference artefact the system exposes and switches each one off in turn — and a system exposing no such artefact is reported unattainable on it rather than judged by whether its explanation field is non-blank. What that duty does not reach is stated rather than implied: the right is triggered by a request from an affected person, the clause reaches Annex III systems other than those under point 2, and it bites only on a decision the person considers adversely to affect their health, safety or fundamental rights — none of the three is a fact about a decision record, so no run here establishes that the duty applied at all. Its property is also byte-identical to that of ecoa_reg_b_1002_9_b_2_principal_reasons_complete, on the deliberate reading that the clause's main elements and 12 CFR 1002.9(b)(2)'s principal reasons are the same demand on the same evidence: a system audited against both packs cannot satisfy one and violate the other, so a reader must not take two agreeing verdicts for two independent checks. The two duties keep different gates — this one is limited to the high-risk class and to no decision domain — so neither reaches a system through the other. The clause's other explanation, of the role of the AI system in the decision-making procedure, is not modelled at all. Article 86(2) and Article 86(3) are the clause's own carve-outs and the property carries neither; docs/refinement.md records all of it."

[source]
document = "Regulation (EU) 2024/1689 of the European Parliament and of the Council"
publication = "Official Journal of the European Union, OJ L, 2024/1689, 12.7.2024"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689"

[[requirement]]
id = "eu_ai_act_art12_1_automatic_logging"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 12(1)"
verbatim_text = "High-risk AI systems shall technically allow for the automatic recording of events (logs) over the lifetime of the system."
stakeholder = "regulator"
formalism = "record"
spec = "present(artifact_logs_event_log) and present(provenance_model_version)"
rationale = "Automatic lifetime event logs retaining decision events."
requires = [
    "artifact_logs_event_log",
    "provenance_model_version",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art12_2_traceability_monitoring"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 12(2)"
verbatim_text = """In order to ensure a level of traceability of the functioning of a high-risk AI system that is appropriate to the intended purpose of the system, logging capabilities shall enable the recording of events relevant for:
   (a) identifying situations that may result in the high-risk AI system presenting a risk within the meaning of Article 79(1) or in a substantial modification;
   (b) facilitating the post-market monitoring referred to in Article 72; and
   (c) monitoring the operation of high-risk AI systems referred to in Article 26(5)."""
stakeholder = "regulator"
formalism = "record"
spec = "present(artifact_logs_event_log) and present(provenance_model_version)"
rationale = "Every decision carries an event log entry identifying the model version that produced it."
requires = [
    "artifact_logs_event_log",
    "provenance_model_version",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art13_1_transparency_deployers"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 13(1)"
verbatim_text = "High-risk AI systems shall be designed and developed in such a way as to ensure that their operation is sufficiently transparent to enable deployers to interpret a system’s output and use it appropriately. An appropriate type and degree of transparency shall be ensured with a view to achieving compliance with the relevant obligations of the provider and deployer set out in Section 3."
stakeholder = "deployer"
formalism = "record"
spec = """\
present(scope_statements_explanation_scope) and \
present(artifact_logs_reason_explanation) and \
present(provenance_model_version)"""
rationale = "Decision output accompanied by explanation scope and model provenance for deployers."
requires = [
    "scope_statements_explanation_scope",
    "artifact_logs_reason_explanation",
    "provenance_model_version",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art13_2_instructions_for_use"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 13(2)"
verbatim_text = "High-risk AI systems shall be accompanied by instructions for use in an appropriate digital format or otherwise that include concise, complete, correct and clear information that is relevant, accessible and comprehensible to deployers."
stakeholder = "deployer"
formalism = "record"
spec = "present(scope_statements_approximation_vs_guarantee) and present(provenance_constraint_set)"
rationale = "Instructions for use and performance bounds accessible to deployers."
requires = [
    "scope_statements_approximation_vs_guarantee",
    "provenance_constraint_set",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "strict"

[[requirement]]
id = "eu_ai_act_art86_1_main_elements_of_the_decision"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 86(1)"
verbatim_text = "Any affected person subject to a decision which is taken by the deployer on the basis of the output from a high-risk AI system listed in Annex III, with the exception of systems listed under point 2 thereof, and which produces legal effects or similarly significantly affects that person in a way that they consider to have an adverse impact on their health, safety or fundamental rights shall have the right to obtain from the deployer clear and meaningful explanations of the role of the AI system in the decision-making procedure and the main elements of the decision taken."
stakeholder = "affected individual"
formalism = "logical"
spec = """\
present(artifact_logs_reason_explanation) -> \
(artifact_logs_deleted_reason_count <= 0)"""
rationale = """Where a decision carries an explanation — the explanation the clause gives the \
affected person the right to obtain, and the only part of the right a decision record can carry \
at all — no element the decision's own inference used is missing from it. The count is measured, \
never read from the log: reasonsmith enumerates the decision's reasons exactly from the inference \
artefact the system exposes and switches each one off in turn, and counts the reasons the \
system's own answer turns out not to depend on. The threshold is zero and is not this pack's \
invention: the clause requires the main elements of the decision taken, so an element that moved \
exact inference and not the system is a main element the explanation does not state. This is the \
reading that main elements refines against the inference's own reasons, and it is a cited \
assumption rather than a settled question of law — docs/refinement.md column four is where it is \
recorded and where a different reading gets corrected. Nothing here decides whether the \
explanation given is clear and meaningful, which is the clause's other adjective pair and is not \
modelled; nothing here establishes that the right was exercised, that the system is an Annex III \
system other than one under point 2, or that the decision adversely affected the person."""
requires = [
    "artifact_logs_reason_explanation",
    "artifact_logs_deleted_reason_count",
]
binding = true
scope = "high-risk"
domains = []
deontic_type = "obligation"
defeasibility = "defeasible-unmodelled"

[[requirement]]
id = "eu_ai_act_art50_5_disclosure_timing"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 50(5)"
verbatim_text = "The information referred to in paragraphs 1 to 4 shall be provided to the natural persons concerned in a clear and distinguishable manner at the latest at the time of the first interaction or exposure. The information shall conform to the applicable accessibility requirements."
stakeholder = "affected individual"
formalism = "temporal"
spec = "always(present(artifact_logs_natural_person_interaction) -> present(artifact_logs_ai_disclosure))"
rationale = "At every recorded natural-person interaction boundary, the system records that the AI disclosure was provided at or before the first interaction or exposure. This is an ordering check over the supplied trace, not a finding that the disclosure was clear, distinguishable, accessible, or understood."
requires = [
    "artifact_logs_natural_person_interaction",
    "artifact_logs_ai_disclosure",
]
binding = true
scope = "limited-risk"
domains = []
deontic_type = "obligation"
defeasibility = "defeasible-unmodelled"

[[requirement]]
id = "eu_ai_act_art50_2_synthetic_content_marking"
source_document = "EU AI Act (Regulation (EU) 2024/1689)"
article_clause = "Article 50(2)"
verbatim_text = "Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable format and detectable as artificially generated or manipulated."
stakeholder = "affected individual"
formalism = "record"
spec = "present(artifact_logs_synthetic_content_mark)"
rationale = "A generated-content output record carries a machine-readable synthetic-content marking. This is only a presence check: it does not establish that the marking is detectable, effective, interoperable, robust, reliable, or technically feasible, and it does not decide any Article 50(2) exception."
requires = [
    "artifact_logs_synthetic_content_mark",
]
binding = true
scope = "limited-risk"
domains = []
deontic_type = "obligation"
defeasibility = "defeasible-unmodelled"
