[pack]
id = "gdpr"
title = "GDPR (Regulation (EU) 2016/679): Article 22 & Recital 71"
description = """Requirements for automated individual decision-making, profiling safeguards, and explanations. \
One duty here is `logical`: `gdpr_art22_1_no_prohibited_decision_for_any_input` asks the proof engine whether the \
decision rules a system exposes through `logic()` admit any input at all on which the decision is solely automated \
and significantly affecting while no Article 22(2) basis is present, or while the Article 22(3) route to human \
intervention is closed under point (a) or (c). A `proved` verdict there is a statement about those exposed rules over \
every input the declared constraints admit. It is not a determination that the controller has discharged Article 22, \
and reasonsmith makes no such determination: the rules are taken as describing the system, whether the recorded \
inputs are true of a real decision is outside what any engine here checks, and Article 22 reaches organisational \
facts no decision rule carries."""

[source]
document = "Regulation (EU) 2016/679 of the European Parliament and of the Council (GDPR)"
publication = "Official Journal of the European Union, OJ L 119, 4.5.2016, p. 1–88"
url = "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679"

[[requirement]]
id = "gdpr_art22_1_automated_decision_prohibition"
source_document = "GDPR (Regulation (EU) 2016/679)"
article_clause = "Article 22(1)"
verbatim_text = "The data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her."
stakeholder = "affected individual"
formalism = "record"
spec = "Decisions producing legal/significant effects record decision logic and provenance."
requires = [
    "artifact_logs_decision_record",
    "provenance_active_exceptions",
]
binding = true
scope = ""

[[requirement]]
id = "gdpr_art22_1_no_prohibited_decision_for_any_input"
source_document = "GDPR (Regulation (EU) 2016/679)"
article_clause = "Article 22(1)"
verbatim_text = "The data subject shall have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning him or her or similarly significantly affects him or her."
stakeholder = "affected individual"
formalism = "logical"
spec = """\
Implies(artifact_logs_solely_automated and artifact_logs_significant_effect, \
(provenance_basis_contract or provenance_basis_union_or_member_state_law or provenance_basis_explicit_consent) \
and Implies(provenance_basis_contract or provenance_basis_explicit_consent, \
artifact_logs_human_intervention_route))"""
requires = [
    "artifact_logs_solely_automated",
    "artifact_logs_significant_effect",
    "artifact_logs_human_intervention_route",
    "provenance_basis_contract",
    "provenance_basis_union_or_member_state_law",
    "provenance_basis_explicit_consent",
]
binding = true
scope = ""

[[requirement]]
id = "gdpr_art22_3_safeguards_human_intervention"
source_document = "GDPR (Regulation (EU) 2016/679)"
article_clause = "Article 22(3)"
verbatim_text = "In the cases referred to in points (a) and (c) of paragraph 2, the data controller shall implement suitable measures to safeguard the data subject's rights and freedoms and legitimate interests, at least the right to obtain human intervention on the part of the controller, to express his or her point of view and to contest the decision."
stakeholder = "affected individual"
formalism = "record"
spec = "Safeguards providing contestation endpoints and human review pathways."
requires = [
    "artifact_logs_decision_record",
    "scope_statements_local_vs_global",
]
binding = true
scope = ""

[[requirement]]
id = "gdpr_recital71_meaningful_explanation"
source_document = "GDPR (Regulation (EU) 2016/679)"
article_clause = "Recital 71"
verbatim_text = "In any case, such processing should be subject to suitable safeguards, which should include specific information to the data subject and the right to obtain human intervention, to express his or her point of view, to obtain an explanation of the decision reached after such assessment and to challenge the decision."
stakeholder = "affected individual"
formalism = "record"
spec = "Per-decision explanation and logic scope for data subjects."
requires = [
    "artifact_logs_reason_explanation",
    "scope_statements_explanation_scope",
    "provenance_model_version",
]
binding = false
scope = ""

[[requirement]]
id = "gdpr_recital71_error_risk_minimised"
source_document = "GDPR (Regulation (EU) 2016/679)"
article_clause = "Recital 71"
verbatim_text = "In order to ensure fair and transparent processing in respect of the data subject, taking into account the specific circumstances and context in which the personal data are processed, the controller should use appropriate mathematical or statistical procedures for the profiling, implement technical and organisational measures appropriate to ensure, in particular, that factors which result in inaccuracies in personal data are corrected and the risk of errors is minimised, secure personal data in a manner that takes account of the potential risks involved for the interests and rights of the data subject and that prevents, inter alia, discriminatory effects on natural persons on the basis of racial or ethnic origin, political opinion, religion or beliefs, trade union membership, genetic or health status or sexual orientation, or that result in measures having such an effect."
stakeholder = "affected individual"
formalism = "temporal"
spec = "always(scope_statements_declared_deviation <= artifact_logs_decision_margin)"
requires = [
    "scope_statements_declared_deviation",
    "scope_statements_approximation_vs_guarantee",
    "artifact_logs_decision_margin",
]
binding = false
scope = ""
