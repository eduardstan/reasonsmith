name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Same one command a stranger runs from a fresh clone (README, "Quick Start"):
      # nesyarena is pinned to exact version 0.1.0 on PyPI in pyproject.toml, so this environment
      # and a local one resolve to the same code. torch is deliberately not installed — see README.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # 93% is the suite's measured total today; a floor to be raised deliberately, never lowered.
      - run: pytest --cov=reasonsmith --cov-report=term-missing --cov-fail-under=93
      - run: python -m reasonsmith.demo
