name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      # Coverage is measured per runner. Linux/Python 3.12 is canonical at the 95% gate;
      # Windows has a lower reachable total because platform-only BLACK/Marabou/ONNX paths are
      # skipped there. Rule: floor = leg's measured coverage rounded down to one decimal.
      # This run measured Windows 3.11/3.12 at 95.07% and 3.13 at 95.13%.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            coverage_floor: "95"
          - os: ubuntu-latest
            python-version: "3.12"
            coverage_floor: "95"
          - os: ubuntu-latest
            python-version: "3.13"
            coverage_floor: "95"
          - os: windows-latest
            python-version: "3.11"
            coverage_floor: "95.0"
          - os: windows-latest
            python-version: "3.12"
            coverage_floor: "95.0"
          - os: windows-latest
            python-version: "3.13"
            coverage_floor: "95.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Same one command a contributor runs from a fresh clone (CONTRIBUTING.md, "Development
      # Environment Setup"): nesyarena is pinned to exact version 0.1.0 on PyPI in pyproject.toml,
      # so this environment and a local one resolve to the same code. torch is deliberately not
      # installed — see RESULTS.md, "What Changed From Prior Torch Caveats".
      - run: pip install -e ".[dev,neural,pdf]"
      - name: Install BLACK solver (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/black_install
          cd /tmp/black_install
          curl -sLO https://github.com/black-sat/black/releases/download/v26.05.0/black-sat-26.05.0.ubuntu26.04.x86_64.deb
          curl -sLO http://ftp.us.debian.org/debian/pool/main/f/fmtlib/libfmt10_10.1.1+ds1-4+b2_amd64.deb
          dpkg-deb -x black-sat-26.05.0.ubuntu26.04.x86_64.deb ./black_ext
          dpkg-deb -x libfmt10_10.1.1+ds1-4+b2_amd64.deb ./libfmt_ext
          PYTHON_Z3_DIR=$(python -c "import z3, os; print(os.path.dirname(z3.__file__))")/lib
          mkdir -p /tmp/black_bin /tmp/black_bin/lib_extra
          cp ./libfmt_ext/usr/lib/x86_64-linux-gnu/libfmt.so.10* /tmp/black_bin/lib_extra/
          ln -s "${PYTHON_Z3_DIR}/libz3.so" /tmp/black_bin/lib_extra/libz3.so.4
          cat << 'EOF' > /tmp/black_bin/black
          #!/bin/bash
          export LD_LIBRARY_PATH="/tmp/black_install/black_ext/usr/lib:/tmp/black_bin/lib_extra:${LD_LIBRARY_PATH}"
          exec /tmp/black_install/black_ext/usr/bin/black "$@"
          EOF
          chmod +x /tmp/black_bin/black
          echo "/tmp/black_bin" >> $GITHUB_PATH
      - name: Install BLACK solver (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $url = "https://github.com/black-sat/black/releases/download/v26.05.0/black-26.05.0-win-x64.zip"
          $zipPath = "$env:RUNNER_TEMP\black.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\black_install"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\black_install\BLACK"
      - name: Verify BLACK solver
        run: black --version
      - run: ruff check .
      # Scoped by `[tool.mypy]` in pyproject.toml to the two modules whose types are the semantics,
      # so this is seconds and its output is short enough to read.
      - run: mypy
      # The 95% floor is a measured credibility gate. Precision is `[tool.coverage.report]` in
      # pyproject.toml, and `test_the_coverage_floor_fails_a_total_below_it` keeps it biting.
      - run: pytest --cov=reasonsmith --cov-report=term-missing --cov-report=json:/tmp/reasonsmith-coverage.json --cov-fail-under=${{ matrix.coverage_floor }}
      - name: Verify the measured coverage badge
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python docs/build_coverage_badge.py /tmp/reasonsmith-coverage.json docs/assets/coverage.svg
          git diff --exit-code -- docs/assets/coverage.svg
      - run: python -m reasonsmith.demo

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the shipped symbolic example through the composite action
        uses: ./
        with:
          system-module: reasonsmith.examples.symbolic_rules:system_under_test
          packs: ecoa
          # The example intentionally leaves some duties outside its evidence surface;
          # this smoke job tests report production without changing the action's strict default.
          strict-unresolved: false
          report-artifact-path: action-smoke-reports

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the lightweight image
        run: docker build --tag reasonsmith-ci-smoke .
      - name: Run a shipped example and extract both reports
        run: |
          mkdir -p docker-smoke-reports
          docker run --rm \
            --volume "$PWD/docker-smoke-reports:/reports" \
            reasonsmith-ci-smoke check \
            --system-module reasonsmith.examples.symbolic_rules:system_under_test \
            --pack ecoa --json --html /reports/ecoa.html > docker-smoke-reports/ecoa.json
          test -s docker-smoke-reports/ecoa.json
          test -s docker-smoke-reports/ecoa.html
