name: statute-drift

on:
  workflow_dispatch:
  schedule:
    # First day of every month, 03:00 UTC: re-fetch the official statutory sources and check the
    # packs' verbatim quotes against them as the law reads today.
    - cron: "0 3 1 * *"

permissions:
  contents: read

concurrency:
  group: statute-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    # This job only checks the sources and produces artefacts for the jobs below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Same one command a contributor runs from a fresh clone (CONTRIBUTING.md, "Development
      # Environment Setup").
      - run: pip install -e ".[dev]"
      # Exits 1 when any quote differs, any source is unreachable, or a registered passage can no
      # longer be extracted, and always writes drift-report.json before doing so, so the issue job
      # below can read the findings.
      # `--verification-manifest` writes docs/legal-verification.json only when nothing drifted, so
      # a run that finds a difference leaves the previous verification date standing rather than
      # overwriting it with a failure.
      - name: Re-fetch official sources and compare pack quotes
        run: |
          python -m reasonsmith.drift \
            --report drift-report.json \
            --verification-manifest docs/legal-verification.json
      - name: Save the drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statute-drift-report
          path: drift-report.json
          if-no-files-found: ignore
      - name: Save the successful verification manifest
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: statute-verification-manifest
          path: docs/legal-verification.json
          if-no-files-found: error

  report-drift:
    needs: drift
    if: ${{ always() && needs.drift.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the drift report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: statute-drift-report
          path: .
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - drift-report.json <<'PY'
          import json
          import os
          import subprocess
          import sys

          path = sys.argv[1]
          if not os.path.isfile(path):
              sys.exit("no drift-report.json; the drift job failed for another reason")
          data = json.load(open(path, encoding="utf-8"))
          if not data.get("findings"):
              sys.exit("report has no findings; nothing to file")
          title = "Statute drift: pack quotes no longer match the official legal sources"
          body = (
              "The monthly statute drift check re-fetched the official sources and found "
              "requirements whose `verbatim_text` no longer matches. A `differ` finding means the "
              "quote does not occur in the extracted passage after whitespace collapsing; "
              "`could-not-verify` means the source was unreachable or its registered passage "
              "could not be extracted. The packs are never edited automatically.\n\n"
              "<details>\n<summary>Full report</summary>\n\n```\n"
              + data["report"]
              + "\n```\n</details>"
          )
          open_issues = json.loads(subprocess.run(
              ["gh", "issue", "list", "--state", "open", "--search",
               f'"{title}" in:title', "--limit", "100", "--json", "number,title"],
              capture_output=True, text=True, check=True,
          ).stdout)
          open_number = next(
              (str(issue["number"]) for issue in open_issues if issue["title"] == title),
              "",
          )
          if open_number:
              subprocess.run(["gh", "issue", "comment", open_number, "--body", body], check=True)
          else:
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=True)
          PY

  publish-manifest:
    needs: drift
    if: needs.drift.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The publication job regenerates the site-facing counts after installing the package, so
      # the manifest's verification date is reflected in the committed counts as well.
      - run: pip install -e .
      - name: Download the verification manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: statute-verification-manifest
          path: .statute-verification
      - name: Open or update the manifest PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MANIFEST_BRANCH: bot/statute-drift-manifest
          MANIFEST: .statute-verification/legal-verification.json
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$MANIFEST_BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$MANIFEST" docs/legal-verification.json
          reasonsmith published-counts -o docs/published-counts.json

          open_pr="$(gh pr list --head "$MANIFEST_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if git diff --quiet -- docs/legal-verification.json docs/published-counts.json; then
            echo "verification manifest and published counts unchanged"
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch
            elif git ls-remote --exit-code --heads origin "$MANIFEST_BRANCH" >/dev/null 2>&1; then
              git push origin --delete "$MANIFEST_BRANCH"
            fi
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/legal-verification.json docs/published-counts.json
          git commit -m "chore: record the statute verification of $(date -u +%Y-%m-%d)"
          # The bot branch is intentionally force-updated so one recurring run owns one PR.
          git push --force origin "HEAD:$MANIFEST_BRANCH"

          read -r -d '' body <<'EOF' || true
          This updates `docs/legal-verification.json`, the machine-readable manifest recording the
          date and quote-corpus digest from a successful scheduled statute-drift verification run,
          and `docs/published-counts.json`, which publishes that verification status for the site.
          They were produced by the scheduled workflow and are published here for review rather than
          pushed to the default branch. The pinned official artifact actions only transfer the
          report and manifest between the read-only check and write-scoped publication jobs; no
          third-party runtime or action dependency was added.

          Verified locally: the drift module's `--verification-manifest` output shape and this
          workflow's YAML syntax. Not verified locally: GitHub Actions scheduling, artifact
          transfer, branch force-update, or PR reuse. The 1 September cron run will prove those
          hosted-workflow paths.
          EOF
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body "$body"
          else
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$MANIFEST_BRANCH" \
              --title "chore: publish statute verification manifest" \
              --body "$body"
          fi
