name: publish

# Fires on a published GitHub Release, not on a tag push: a tag can be moved, a release is a
# deliberate act. This workflow is the whole publish mechanism for reasonsmith; it must be the
# only thing that can upload to PyPI, and it must never be pointed at a token.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Same one command a contributor runs from a fresh clone (CONTRIBUTING.md, "Development
      # Environment Setup"), plus the
      # `build` frontend that provides `python -m build`. nesyarena is pinned to exact 0.1.0 on
      # PyPI in pyproject.toml, so this environment and a local one resolve to the same code.
      - run: pip install -e ".[dev]" build
      - run: ruff check .
      # The same floor `ci.yml` runs, compared at the precision `[tool.coverage.report]` sets.
      # It reads 92.5 rather than 93 because of a recorded decision of 2026-08-04 — `ci.yml`'s
      # comment on this step is the record, and this number moves only when that one does.
      - run: pytest --cov=reasonsmith --cov-report=term-missing --cov-fail-under=92.5
      # A release that is not tagged `v` + the version in pyproject.toml would publish a
      # number nobody chose, and a PyPI version can never be reused. The tag is the one GitHub
      # fired this workflow for, and it must agree with the version being built. It reaches the
      # script through `env:` so a tag value is data, never shell.
      - name: Verify the release tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag '$TAG' does not match version 'v$version' in pyproject.toml"
            exit 1
          fi
      # A release that fails its own tests must not reach PyPI, where a version number can never
      # be reused. The dist is built only after the suite passes, and the publish job uploads
      # exactly these files.
      - name: Build the distributions
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload release to PyPI
    needs: test-build
    runs-on: ubuntu-latest
    # Before first use, the project owner must register this workflow as a Trusted Publisher in
    # PyPI's reasonsmith Publishing settings: owner eduardstan, repository reasonsmith, workflow
    # publish.yml, environment pypi. Repository changes cannot perform or verify that account-side
    # setup; until it is registered, the first publish attempt will fail by design.
    environment:
      name: pypi
      url: https://pypi.org/p/reasonsmith
    permissions:
      # Mandatory for Trusted Publishing: GitHub mints the short-lived OIDC token only when this
      # permission is granted, and that token is what PyPI verifies. There is no API token
      # anywhere — not in repository secrets, not on a laptop. If this job has no `id-token`
      # permission, the upload fails with an authentication error that looks nothing like the
      # real cause. It is granted only to this job, never at workflow level.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        # Trusted Publishing mints a short-lived OIDC token for whatever code this line resolves to,
        # so it is the one action in this repository where a moved tag would be handed a credential.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
