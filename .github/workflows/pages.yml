name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build report
        run: |
          # Publish the committed page rather than re-rendering it here. `docs/index.html` is
          # held byte-for-byte to `render_html()` by `test_docs_index_html_matches_the_renderer`,
          # and it is the one page composed with the demonstration's key finding — which the
          # renderer never adds on its own, because it is about case APP-1042 and not about
          # whatever system a report is run on. Rendering it again from the CLI here would
          # publish a page that no test checks and that is missing that section.
          mkdir -p _site
          cp docs/index.html _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
