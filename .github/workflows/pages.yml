name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Build report
        run: |
          mkdir -p _site
          # The CLI exits 2 when a requirement is violated. A violation in the example is
          # expected and is the whole point of the example — form completeness does not imply
          # reason fidelity — so exit 2 must still publish. Any other non-zero exit is a real
          # failure and still fails the deploy.
          python -m reasonsmith.cli check --system docs/sample_decisions.jsonl --pack table7 --system-name "CreditScoringPipeline" --html _site/index.html || [ $? -eq 2 ]
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
