version: 2
updates:
  # One pull request a week per ecosystem for everything below a major, rather than one per
  # dependency: a solo maintainer reviews the batch, and a major still arrives on its own.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # nesyarena is pinned to an exact version on purpose: RESULTS.md's measurements have to stay
      # reconstructible, and pyproject.toml is the record of which code produced them (AGENTS.md,
      # "Dependency"). Bumping it is a deliberate decision with a re-measurement behind it, never a
      # weekly automatic pull request.
      - dependency-name: nesyarena
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
