version: 2
updates:
  # One pull request a week per ecosystem for everything below a major, rather than one per
  # dependency: a solo maintainer reviews the batch, and a major still arrives on its own.
  # `pip`, not `uv`: .gitignore excludes uv.lock, so pyproject.toml is the only Python manifest in
  # the tree — and it is the one `pip install -e ".[dev]"` resolves from in ci.yml and publish.yml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # nesyarena is pinned to an exact version on purpose: RESULTS.md's measurements have to stay
      # reconstructible, and pyproject.toml is the record of which code produced them (AGENTS.md,
      # "Dependency"). Bumping it is a deliberate decision with a re-measurement behind it, never a
      # weekly automatic pull request.
      - dependency-name: nesyarena
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # `init` and `analyze` are two paths into one action and must run the same major: when they
      # disagree the job dies with `Loaded a configuration file for version '3.37.7', but running
      # version '4.37.6'` — which is #184, where Dependabot moved `analyze` to v4 on its own because
      # it reads the two paths as two dependencies. This group carries majors as well, so the pair
      # always arrives in one pull request; every other action keeps its major to itself, where a
      # breaking change is worth reading alone.
      codeql-action:
        patterns: ["github/codeql-action*"]
        update-types: [major, minor, patch]
      actions:
        exclude-patterns: ["github/codeql-action*"]
        update-types: [minor, patch]
