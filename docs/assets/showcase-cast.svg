    @keyframes rs-cast-k19 { 0%, 37.255% { opacity: 0 } 37.655%, 100% { opacity: 1 } }
    @keyframes rs-cast-k20 { 0%, 39.216% { opacity: 0 } 39.616%, 100% { opacity: 1 } }
