    @keyframes rs-cast-k25 { 0%, 49.020% { opacity: 0 } 49.420%, 100% { opacity: 1 } }
  </style>
  <rect class="rs-cast-bg" x="0" y="0" width="1162" height="536" rx="8"/>
  <rect class="rs-cast-bar" x="0.5" y="0.5" width="1161" height="32"/>
  <circle cx="20" cy="16" r="5" fill="#e06c60"/>
  <circle cx="38" cy="16" r="5" fill="#d9ae4e"/>
  <circle cx="56" cy="16" r="5" fill="#6fbf8a"/>
  <text class="rs-cast-title" x="581" y="20" text-anchor="middle">reasonsmith &#183; excerpt of two real runs</text>
  <text class="rs-cast-row rs-cast-prompt" style="animation-name: rs-cast-k0" x="18.0" y="63.5" xml:space="preserve">$ reasonsmith check --system-module reasonsmith.demo:deployed_credit_system --pack ecoa --system-name TruncatingCreditSystem</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k1" x="18.0" y="81.5" xml:space="preserve">CONFORMANCE REPORT</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k2" x="18.0" y="99.5" xml:space="preserve">system: TruncatingCreditSystem</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k3" x="18.0" y="117.5" xml:space="preserve">declared scope: undeclared</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k4" x="18.0" y="135.5" xml:space="preserve">declared domains: consumer-credit</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k5" x="18.0" y="153.5" xml:space="preserve">pack: ecoa</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k6" x="18.0" y="171.5" xml:space="preserve">headline: 6 requirements · 6 binding: 3 observed, 1 violated, 1 not evaluated, 1 unattainable · all positives observed-only</text>
  <text class="rs-cast-row rs-cast-elision" style="animation-name: rs-cast-k7" x="18.0" y="189.5" xml:space="preserve">  ⋯ 12 line(s) not shown</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k8" x="18.0" y="207.5" xml:space="preserve">  [OBSERVED] ecoa_reg_b_1002_9_b_2_specific_reasons (ECOA / Regulation B (12 CFR 1002.9) 12 CFR 1002.9(b)(2)): satisfied</text>
  <text class="rs-cast-row rs-cast-elision" style="animation-name: rs-cast-k9" x="18.0" y="225.5" xml:space="preserve">  ⋯ 5 line(s) not shown</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k10" x="18.0" y="243.5" xml:space="preserve">  [PROBED] ecoa_reg_b_1002_9_b_2_principal_reasons_complete (ECOA / Regulation B (12 CFR 1002.9) 12 CFR 1002.9(b)(2)): violated</text>
  <text class="rs-cast-row rs-cast-elision" style="animation-name: rs-cast-k11" x="18.0" y="261.5" xml:space="preserve">  ⋯ 5 line(s) not shown</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k12" x="18.0" y="279.5" xml:space="preserve">    offending record: decision APP-1042 (step 1)</text>
  <text class="rs-cast-row rs-cast-elision" style="animation-name: rs-cast-k13" x="18.0" y="297.5" xml:space="preserve">  ⋯ 14 line(s) not shown</text>
  <text class="rs-cast-row rs-cast-exit" style="animation-name: rs-cast-k14" x="18.0" y="315.5" xml:space="preserve">  [exit status 2]</text>
  <text class="rs-cast-row rs-cast-blank" style="animation-name: rs-cast-k15" x="18.0" y="333.5" xml:space="preserve"></text>
  <text class="rs-cast-row rs-cast-prompt" style="animation-name: rs-cast-k16" x="18.0" y="351.5" xml:space="preserve">$ reasonsmith check --system-module reasonsmith.demo:deployed_credit_system --pack ecoa --system-name TruncatingCreditSystem --audience affected-individual</text>
  <text class="rs-cast-row rs-cast-elision" style="animation-name: rs-cast-k17" x="18.0" y="369.5" xml:space="preserve">  ⋯ 10 line(s) not shown</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k18" x="18.0" y="387.5" xml:space="preserve">WHETHER THOSE WERE ALL THE REASONS</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k19" x="18.0" y="405.5" xml:space="preserve">    4 further reason(s) the system&#x27;s own answer depended on were not stated. Measured by re-running its inference, not inferred from its log:</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k20" x="18.0" y="423.5" xml:space="preserve">    &quot;C05 — Insufficient number of credit references provided&quot;</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k21" x="18.0" y="441.5" xml:space="preserve">    &quot;C03 — Delinquent past or present credit obligations&quot;</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k22" x="18.0" y="459.5" xml:space="preserve">    &quot;C04 — Too many recent inquiries on credit bureau report&quot;</text>
  <text class="rs-cast-row rs-cast-out" style="animation-name: rs-cast-k23" x="18.0" y="477.5" xml:space="preserve">    &quot;C02 — Length of time credit has been established is too short&quot;</text>
  <text class="rs-cast-row rs-cast-elision" style="animation-name: rs-cast-k24" x="18.0" y="495.5" xml:space="preserve">  ⋯ 15 line(s) not shown</text>
  <text class="rs-cast-row rs-cast-exit" style="animation-name: rs-cast-k25" x="18.0" y="513.5" xml:space="preserve">  [exit status 2]</text>
</svg>
